[project]
name = "dio_bank"
version = "0.1.0"
description = ""
authors = [
    {name = "amanmdest",email = "amanmdest@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "flask-sqlalchemy",
    "flask-migrate",
    "flask-jwt-extended",
    "psycopg2-binary",
    "gunicorn",
]

[tool.poetry.group.dev.dependencies]
taskipy = "^1.14.1"
ruff = "^0.16.3"
coverage = "^7.15.4"
pytest-cov = "^7.1.0"
pytest = "*"
pytest-mock = "*"

[tool.pytest]
addopts = ["-ra", "-vv"]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT', 'FAST']
ignore = ["PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F821"]

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.taskipy.tasks]
lint = "ruff check"
pre_format = "ruff check --fix"
format = "ruff format"
run = "flask --app src.app run --debug"
pre_test = "task lint"
test = "pytest -s --cov=src -vv"
post_test = "coverage html"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
